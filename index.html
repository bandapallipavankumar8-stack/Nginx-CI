<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Zone | Best Smartphone Deals</title>
    <style>
        /* Global Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* Header & Navigation */
        header {
            background-color: #1a1a2e;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
        }
        nav ul {
            display: flex;
            list-style: none;
        }
        nav ul li {
            margin-left: 20px;
        }
        nav ul li a:hover {
            color: #e94560;
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://unsplash.com') no-repeat center center/cover;
            height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .hero h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .hero p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #e94560;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #0f3460;
        }

        /* Product Section */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .section-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            position: relative;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            text-align: center;
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-img {
            max-width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        .product-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .product-price {
            color: #e94560;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .buy-btn {
            background-color: #0f3460;
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .buy-btn:hover {
            background-color: #e94560;
        }

        /* Footer */
        footer {
            background-color: #1a1a2e;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">MobileZone</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Phones</a></li>
                <li><a href="#">Accessories</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Banner -->
    <section class="hero">
        <h1>Latest Smartphones. Unbeatable Prices.</h1>
        <p>Get up to 20% off on newly launched flagship models this week.</p>
        <button class="btn">Shop Now</button>
    </section>

    <!-- Products Grid -->
    <main class="container">
        <h2 class="section-title">Featured Smartphones</h2>
        <div class="grid">
            
            <!-- Product 1 -->
            <div class="product-card">
                <img class="product-img" src="https://unsplash.com" alt="Smartphone Alpha">
                <div class="product-name">Apex Phone 15 Pro</div>
                <div class="product-price">$999</div>
                <button class="buy-btn">Add to Cart</button>
            </div>

            <!-- Product 2 -->
            <div class="product-card">
                <img class="product-img" src="https://unsplash.com" alt="Smartphone Beta">
                <div class="product-name">Galaxy X Ultra</div>
                <div class="product-price">$1,199</div>
                <button class="buy-btn">Add to Cart</button>
            </div>

            <!-- Product 3 -->
            <div class="product-card">
                <img class="product-img" src="https://unsplash.com" alt="Smartphone Gamma">
                <div class="product-name">Nova Lite 10</div>
                <div class="product-price">$450</div>
                <button class="buy-btn">Add to Cart</button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 MobileZone Store. All rights reserved.</p>
    </footer>

</body>
</html>
